{% extends 'auth_base.html' %}{% set title='My account' %}{% block content %}<section class="panel auth-card"><p class="eyebrow">MY ACCOUNT</p><h1>{{ current_user.username }}</h1><p class="intro">Role: {{ current_user.role }}. Changing your password signs out all your sessions.</p><form method="post" class="auth-form"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Current password<input name="old_password" type="password" autocomplete="current-password" required maxlength="128"></label><label>New password · 12–128 characters<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><label>Confirm new password<input name="confirm" type="password" autocomplete="new-password" required maxlength="128"></label><button class="primary">Change password</button></form></section>{% endblock %}
